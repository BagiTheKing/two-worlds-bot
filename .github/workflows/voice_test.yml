name: Voice test

# Manual. Renders the same lines with Kokoro and with Chatterbox so the
# voices can be compared by ear. Result: the "voices" artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          pip install kokoro-onnx soundfile
      - name: Kokoro model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python tools/voice_test.py build/voicetest
      - uses: actions/upload-artifact@v4
        with:
          name: voices
          path: build/voicetest/
          retention-days: 14
      - name: Publish to the preview-voices branch (readable without artifact access)
        run: |
          mkdir -p /tmp/pub && cp build/voicetest/*.wav /tmp/pub/
          cd /tmp/pub && git init -q -b preview-voices
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voice test from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-voices
