name: Gemini voice audition

# Manual. A short Noob/Steve exchange read by a few Gemini voice pairings;
# the WAVs and pairs.txt are pushed to the preview-gemini-audition branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests soundfile numpy
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p build/gemini_audition
          python -u tools/gemini_audition.py build/gemini_audition 2>&1 | tee build/gemini_audition/log.txt
      - name: Publish (also on failure, with the log)
        if: always()
        run: |
          mkdir -p /tmp/pub && cp build/gemini_audition/* /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b preview-gemini-audition
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Gemini audition from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-gemini-audition
