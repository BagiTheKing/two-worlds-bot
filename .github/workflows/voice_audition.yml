name: Voice audition

# Manual. Every voice on the ElevenLabs account reads the same test lines
# for the Noob and for Steve; the reels and candidates.txt are pushed to the
# preview-voice-audition branch.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "How many voices to audition"
        default: "14"

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests kokoro-onnx soundfile numpy
      - name: Kokoro model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/voice_audition.py build/audition --max ${{ inputs.max }}
      - name: Publish to the preview-voice-audition branch
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          mkdir -p /tmp/pub && cp build/audition/candidates.txt /tmp/pub/
          for f in build/audition/*_candidates.wav; do ffmpeg -loglevel error -i "$f" -c:a aac -b:a 160k "/tmp/pub/$(basename "${f%.wav}").m4a"; done
          cd /tmp/pub && git init -q -b preview-voice-audition
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voice audition from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-voice-audition
